<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Guildes — connexion des Jeunes Organisateurs</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet" />
<style>
body{margin:0;background:#0E1726}
*{box-sizing:border-box}
a{color:#CFF04A}a:hover{color:#E4FA8A}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid #CFF04A;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0E1726; font-family: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; color: #FFFFFF; display: flex; flex-direction: column; padding: 48px 16px 22px; gap: 16px">

  <div style="display: flex; align-items: center; justify-content: space-between">
    <a href="Main.dc.html" style="height: 44px; padding: 0 12px 0 8px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.18); display: flex; align-items: center; gap: 6px; color: #FFFFFF; text-decoration: none; font-size: 13.5px; font-weight: 600">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5" /><path d="m11 6-6 6 6 6" /></svg>
      Espace invité
    </a>
    <span style="font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-weight: 800; font-size: 17px; letter-spacing: 2px; color: #CFF04A">BDS · ÉQUIPE</span>
  </div>

  <div style="display: flex; flex-direction: column; gap: 6px; padding: 0 2px">
    <h1 style="margin: 0; font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-weight: 700; font-size: 40px; line-height: 0.95">Espace Jeunes<br />Organisateurs</h1>
    <p style="margin: 0; font-size: 14px; line-height: 1.45; color: rgba(255,255,255,0.75)">Entre le code reçu de ta guilde. Ton écran s'adapte à ta mission.</p>
  </div>

  <div style="display: flex; flex-direction: column; gap: 6px">
    <label for="code-jo" style="font-size: 12.5px; font-weight: 600; color: rgba(255,255,255,0.75)">Code d'accès personnel</label>
    <input id="code-jo" type="text" inputmode="numeric" value="482 913" autocomplete="one-time-code" style="height: 58px; border-radius: 16px; border: 1.5px solid rgba(255,255,255,0.22); background: rgba(255,255,255,0.06); padding: 0 16px; font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-weight: 700; font-size: 30px; letter-spacing: 8px; color: #FFFFFF" />
  </div>

  <div role="radiogroup" aria-label="Ta guilde" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
    <sc-for list="{{guilds}}" as="g" hint-placeholder-count="4">
      <button type="button" role="radio" aria-checked="{{g.checked}}" onClick="{{g.pick}}" style="min-height: 124px; border-radius: 18px; border: 2px solid {{g.bd}}; background: {{g.bg}}; padding: 12px; display: flex; flex-direction: column; align-items: flex-start; gap: 8px; text-align: left; cursor: pointer; color: #FFFFFF">
        <span style="width: 36px; height: 36px; border-radius: 10px; background: {{g.tag}}; color: #0E1726; display: flex; align-items: center; justify-content: center">
          <sc-if value="{{g.iStar}}" hint-placeholder-val="{{ true }}"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 3 2.6 5.3 5.9.9-4.3 4.1 1 5.9L12 16.4l-5.2 2.8 1-5.9L3.5 9.2l5.9-.9z" /></svg></sc-if>
          <sc-if value="{{g.iBox}}" hint-placeholder-val="{{ false }}"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 7 9-4 9 4v10l-9 4-9-4z" /><path d="m3 7 9 4 9-4" /><path d="M12 11v10" /></svg></sc-if>
          <sc-if value="{{g.iWhistle}}" hint-placeholder-val="{{ false }}"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8.5" cy="14.5" r="5" /><path d="M12 11 21 6v4l-6.6 2.4" /><path d="M8.5 14.5h.01" /></svg></sc-if>
          <sc-if value="{{g.iCamera}}" hint-placeholder-val="{{ false }}"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z" /><circle cx="12" cy="13" r="3.5" /></svg></sc-if>
        </span>
        <span style="font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-weight: 700; font-size: 21px; line-height: 1">{{g.name}}</span>
        <span style="font-size: 12px; line-height: 1.35; color: rgba(255,255,255,0.72)">{{g.desc}}</span>
      </button>
    </sc-for>
  </div>

  <div style="display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 14px; background: rgba(255,255,255,0.05); font-size: 13px; line-height: 1.45; color: rgba(255,255,255,0.8)">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 1px"><circle cx="12" cy="12" r="9" /><path d="M12 11v6" /><path d="M12 7.5v.01" /></svg>
    <span>Pas encore de code ? Demande-le à un Ambassadeur, au PC organisation du pavillon nord.</span>
  </div>
  <a href="{{enterHref}}" style="margin-top: auto; height: 56px; border-radius: 16px; background: #CFF04A; color: #0E1726; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 10px; font-weight: 700; font-size: 16.5px">
    {{enterLabel}}
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14" /><path d="m13 6 6 6-6 6" /></svg>
  </a>
  <p style="margin: 0; text-align: center; font-size: 12px; line-height: 1.4; color: rgba(255,255,255,0.65)">Code personnel, désactivé à la fin de l'événement.</p>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { g: 'logistique' };
  }
  renderVals() {
    const G = [
      { id: 'ambassadeurs', name: 'Ambassadeurs', desc: 'Gestion de l’événement, coordination des guildes', tag: '#CFF04A', icon: 'star', href: 'Equipe-Ambassadeurs.dc.html' },
      { id: 'logistique', name: 'Logistique', desc: 'Distribution, placement et dénombrement des JO', tag: '#F2C94C', icon: 'box', href: 'Equipe-Logistique.dc.html' },
      { id: 'arbitres', name: 'Arbitres', desc: 'Arbitrage et feuilles de match', tag: '#FFFFFF', icon: 'whistle', href: 'Equipe-Arbitres.dc.html' },
      { id: 'com', name: 'Com', desc: 'Annonces, réseaux sociaux, charte et visuels', tag: '#9AD7F5', icon: 'camera', href: 'Equipe-Com.dc.html' }
    ];
    const cur = G.find((g) => g.id === this.state.g) || G[1];
    return {
      guilds: G.map((g) => {
        const on = g.id === this.state.g;
        return Object.assign({}, g, {
          checked: on ? 'true' : 'false', bd: on ? '#CFF04A' : 'rgba(255,255,255,0.14)', bg: on ? 'rgba(207,240,74,0.10)' : 'rgba(255,255,255,0.04)',
          iStar: g.icon === 'star', iBox: g.icon === 'box', iWhistle: g.icon === 'whistle', iCamera: g.icon === 'camera',
          pick: () => this.setState({ g: g.id })
        });
      }),
      enterHref: cur.href,
      enterLabel: 'Entrer · guilde ' + cur.name
    };
  }
}
</script>
</body>
</html>
