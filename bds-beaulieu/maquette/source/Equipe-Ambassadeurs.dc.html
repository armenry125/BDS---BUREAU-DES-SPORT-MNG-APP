<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Guilde Ambassadeurs — coordination</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet" />
<style>
body{margin:0;background:#F3F4EF}
*{box-sizing:border-box}
a{color:#0E1726}a:hover{color:#2D5BD7}
button,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid #2D5BD7;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F3F4EF; font-family: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; color: #0E1726">
  <div style="position: absolute; left: 0; right: 0; top: 0; bottom: 84px; overflow-y: auto">
    <div style="background: #0E1726; color: #FFFFFF; padding: 48px 16px 16px; display: flex; flex-direction: column; gap: 14px">
      <div style="display: flex; align-items: center; gap: 12px">
        <span style="width: 44px; height: 44px; border-radius: 13px; background: #CFF04A; color: #0E1726; display: flex; align-items: center; justify-content: center; flex: none">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 3 2.6 5.3 5.9.9-4.3 4.1 1 5.9L12 16.4l-5.2 2.8 1-5.9L3.5 9.2l5.9-.9z" /></svg>
        </span>
        <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
          <span style="font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-weight: 700; font-size: 25px; line-height: 1">Guilde Ambassadeurs</span>
          <span style="font-size: 13px; color: rgba(255,255,255,0.75)">Coordination · 11:42</span>
        </div>
      </div>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
        <div style="border-radius: 14px; background: rgba(255,255,255,0.07); padding: 10px; display: flex; flex-direction: column; gap: 2px"><span style="font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-weight: 700; font-size: 28px; line-height: 1">6</span><span style="font-size: 11.5px; color: rgba(255,255,255,0.75)">matchs en cours</span></div>
        <div style="border-radius: 14px; background: rgba(255,255,255,0.07); padding: 10px; display: flex; flex-direction: column; gap: 2px"><span style="font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-weight: 700; font-size: 28px; line-height: 1">34<span style="font-size: 17px; color: rgba(255,255,255,0.7)">/38</span></span><span style="font-size: 11.5px; color: rgba(255,255,255,0.75)">JO sur le terrain</span></div>
        <div style="border-radius: 14px; background: rgba(255,255,255,0.07); padding: 10px; display: flex; flex-direction: column; gap: 2px"><span style="font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-weight: 700; font-size: 28px; line-height: 1">6<span style="font-size: 17px; color: rgba(255,255,255,0.7)">/6</span></span><span style="font-size: 11.5px; color: rgba(255,255,255,0.75)">délégations</span></div>
      </div>
    </div>

    <div style="padding: 14px 16px 24px; display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; align-items: baseline; justify-content: space-between; margin: 2px 4px 0">
        <h2 style="margin: 0; font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-weight: 700; font-size: 22px">À traiter</h2>
        <span style="font-size: 12.5px; font-weight: 600; color: {{todoColor}}">{{todoLabel}}</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px">
        <sc-for list="{{alerts}}" as="al" hint-placeholder-count="3">
          <div style="background: #FFFFFF; border: 1px solid #E1E4EA; border-radius: 16px; padding: 12px; display: flex; flex-direction: column; gap: 10px; opacity: {{al.op}}">
            <div style="display: flex; gap: 10px; align-items: flex-start">
              <span style="width: 32px; height: 32px; border-radius: 10px; background: {{al.ibg}}; color: {{al.ifg}}; display: flex; align-items: center; justify-content: center; flex: none">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{al.icon}}" /></svg>
              </span>
              <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
                <span style="font-size: 14px; font-weight: 700; line-height: 1.3">{{al.title}}</span>
                <span style="font-size: 12.5px; color: #4A5566; line-height: 1.35">{{al.sub}}</span>
              </div>
            </div>
            <sc-if value="{{al.open}}" hint-placeholder-val="{{ true }}">
              <div style="display: flex; gap: 8px">
                <button type="button" onClick="{{al.act}}" style="flex: 1; height: 42px; border-radius: 11px; border: 0; background: #0E1726; color: #FFFFFF; font-size: 13px; font-weight: 700; cursor: pointer">{{al.cta}}</button>
                <sc-if value="{{al.hasAlt}}" hint-placeholder-val="{{ false }}">
                  <button type="button" onClick="{{al.alt}}" style="height: 42px; padding: 0 14px; border-radius: 11px; border: 1.5px solid #CBD2DD; background: #FFFFFF; font-size: 13px; font-weight: 700; cursor: pointer">{{al.altLabel}}</button>
                </sc-if>
              </div>
            </sc-if>
            <sc-if value="{{al.done}}" hint-placeholder-val="{{ false }}">
              <span style="display: flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 700; color: #1A6340"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 4 4 10-10" /></svg>{{al.doneLabel}}</span>
            </sc-if>
          </div>
        </sc-for>
      </div>

      <h2 style="margin: 8px 4px 0; font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-weight: 700; font-size: 22px">Message aux guildes</h2>
      <div style="background: #FFFFFF; border: 1px solid #E1E4EA; border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 10px">
        <div style="display: flex; gap: 6px; flex-wrap: wrap">
          <sc-for list="{{targets}}" as="t" hint-placeholder-count="4">
            <button type="button" aria-pressed="{{t.on}}" onClick="{{t.pick}}" style="height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid {{t.bd}}; background: {{t.bg}}; color: {{t.fg}}; font-size: 12.5px; font-weight: 700; cursor: pointer">{{t.label}}</button>
          </sc-for>
        </div>
        <label for="amb-msg" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Message</label>
        <textarea id="amb-msg" rows="3" style="border-radius: 12px; border: 1.5px solid #CBD2DD; padding: 10px 12px; font-size: 14.5px; line-height: 1.4; resize: none; background: #FBFBF9">Demi-finales basket à 14:00 : 2 JO par terrain dès 13:40, merci !</textarea>
        <button type="button" onClick="{{sendMsg}}" style="height: 48px; border-radius: 14px; border: 0; background: {{sendBg}}; color: #0E1726; font-size: 15px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12 20 4l-6 16-3-7z" /></svg>{{sendLabel}}
        </button>
      </div>

      <a href="Admin-Tableau.dc.html" style="min-height: 60px; display: flex; align-items: center; gap: 12px; padding: 0 14px; border-radius: 18px; background: #FFFFFF; border: 1px solid #E1E4EA; text-decoration: none; color: #0E1726">
        <span style="width: 38px; height: 38px; border-radius: 11px; background: #EEF1F6; display: flex; align-items: center; justify-content: center; flex: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2" /><path d="M8 20h8" /><path d="M12 16v4" /></svg></span>
        <span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14.5px; font-weight: 700">Tableau de bord complet</span><span style="font-size: 12.5px; color: #4A5566">Programme, vestiaires, carte : sur ordinateur</span></span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4A5566" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6" /></svg>
      </a>
    </div>
  </div>

  <nav aria-label="Navigation équipe" style="position: absolute; z-index: 7; left: 0; right: 0; bottom: 0; height: 84px; background: #0E1726; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 6px 8px 22px">
    <a href="Equipe-Ambassadeurs.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #FFFFFF; font-size: 11.5px; font-weight: 700">
      <span style="width: 54px; height: 30px; border-radius: 999px; background: #CFF04A; color: #0E1726; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4h6v3H9z" /><path d="M7 5H5v15h14V5h-2" /><path d="m9 13 2 2 4-4" /></svg></span>
      Mission
    </a>
    <a href="Carte.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: rgba(255,255,255,0.75); font-size: 11.5px; font-weight: 600">
      <span style="width: 54px; height: 30px; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2z" /><path d="M9 4v14" /><path d="M15 6v14" /></svg></span>
      Carte
    </a>
    <a href="Annonces.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: rgba(255,255,255,0.75); font-size: 11.5px; font-weight: 600">
      <span style="width: 54px; height: 30px; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11v2a1 1 0 0 0 1 1h2l5 4V6L6 10H4a1 1 0 0 0-1 1z" /><path d="M15 9a4 4 0 0 1 0 6" /><path d="M18 6a8 8 0 0 1 0 12" /></svg></span>
      Annonces
    </a>
    <a href="Equipe-Connexion.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: rgba(255,255,255,0.75); font-size: 11.5px; font-weight: 600">
      <span style="width: 54px; height: 30px; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5" /><path d="M2.5 20a6.5 6.5 0 0 1 13 0" /><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8" /><path d="M18 14a6 6 0 0 1 3.5 6" /></svg></span>
      Guildes
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { done: {}, target: 'all', sent: false };
  }
  renderVals() {
    const s = this.state;
    const ICON = {
      whistle: 'M12 11 21 6v4l-6.6 2.4 M8.5 9.5a5 5 0 1 0 0 10a5 5 0 1 0 0-10',
      users: 'M9 4.5a3.5 3.5 0 1 0 0 7a3.5 3.5 0 1 0 0-7 M2.5 20a6.5 6.5 0 0 1 13 0 M18 14a6 6 0 0 1 3.5 6',
      mega: 'M3 11v2a1 1 0 0 0 1 1h2l5 4V6L6 10H4a1 1 0 0 0-1 1z M15 9a4 4 0 0 1 0 6'
    };
    const A = [
      { id: 'arb', icon: ICON.whistle, ibg: '#FDEBDD', ifg: '#8A3A06', title: 'Hand 2 · 12:00 : arbitre non confirmé', sub: 'Ali Ouazzani est libre après le foot (fin vers 11:55).', cta: 'Assigner Ali Ouazzani', doneLabel: 'Ali Ouazzani prévenu et assigné' },
      { id: 'jo', icon: ICON.users, ibg: '#FDEBDD', ifg: '#8A3A06', title: 'Plateau ouest : 2 JO manquants', sub: '6 présents sur 8 prévus pour l’échauffement.', cta: 'Prévenir la Logistique', doneLabel: 'Logistique prévenue' },
      { id: 'com', icon: ICON.mega, ibg: '#E7EDFD', ifg: '#1F46B0', title: 'Annonce de la Com à valider', sub: '« Photo officielle de toutes les délégations à 13:30, devant le gymnase. »', cta: 'Publier', alt: 'Refuser', doneLabel: 'Annonce publiée pour tout le monde' }
    ];
    const alerts = A.map((a) => {
      const d = s.done[a.id];
      const mark = (label) => () => { const n = Object.assign({}, this.state.done); n[a.id] = label; this.setState({ done: n }); };
      return Object.assign({}, a, {
        open: !d, done: !!d, op: d ? 0.75 : 1,
        doneLabel: d === 'refused' ? 'Annonce refusée, la Com est prévenue' : a.doneLabel,
        act: mark('ok'), hasAlt: !!a.alt, altLabel: a.alt || '', alt: mark('refused')
      });
    });
    const left = A.filter((a) => !s.done[a.id]).length;
    const T = [['all', 'Toutes les guildes'], ['logistique', 'Logistique'], ['arbitres', 'Arbitres'], ['com', 'Com']];
    const targets = T.map(([id, label]) => {
      const on = s.target === id;
      return { label, on: on ? 'true' : 'false', bg: on ? '#0E1726' : '#FFFFFF', fg: on ? '#FFFFFF' : '#0E1726', bd: on ? '#0E1726' : '#E1E4EA', pick: () => this.setState({ target: id, sent: false }) };
    });
    const tl = T.find((t) => t[0] === s.target)[1];
    return {
      alerts, targets,
      todoLabel: left ? left + ' en attente' : 'Tout est traité', todoColor: left ? '#8A3A06' : '#1A6340',
      sendMsg: () => this.setState({ sent: true }),
      sendLabel: s.sent ? 'Envoyé · ' + tl : 'Envoyer',
      sendBg: s.sent ? '#E6F4EC' : '#CFF04A'
    };
  }
}
</script>
</body>
</html>
